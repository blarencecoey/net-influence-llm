<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Net Influence Results</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1' fill='%232f5fd0'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1' fill='%23e0742a' opacity='.5'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1' fill='%23e0742a' opacity='.5'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1' fill='%232f5fd0'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --panel-2: #f0eee9; --ink: #1d1f23; --muted: #6b6f78;
  --line: #e2dfd8; --accent: #2f5fd0; --good: #1f8a5b; --good-bg: #e3f3ea; --bad: #c0392b;
  --bad-bg: #fbe7e4; --warn: #9a6a00; --warn-bg: #fbf1d6; --true: #fff3c4; --true-line: #d9a400;
  --p0: #2f6fdf; --p1: #e0742a; --p2: #2a9d6f; --p3: #b4479f; --p4: #8a6d1f; --p5: #5b5fc7;
  --rock: #8a7a68; --paper: #3f8fc6; --scissors: #d1495b; --pos: 224,116,42; --neg: 47,111,223;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141518; --panel: #1c1e22; --panel-2: #24272c; --ink: #e8e6e1; --muted: #9a9ea6;
    --line: #2f3238; --accent: #7aa2ff; --good: #4cc38a; --good-bg: #173326; --bad: #ff7a6b;
    --bad-bg: #3a1d1a; --warn: #e6b450; --warn-bg: #3a3018; --true: #3a3315; --true-line: #e6b450;
    --p0: #6f9cff; --p1: #f59a5c; --p2: #4fc79a; --p3: #d878c4; --p4: #c9a64a; --p5: #9a9dff;
    --rock: #b3a28e; --paper: #6db3e6; --scissors: #ef6f80;
  }
}
:root[data-theme="dark"] {
  --bg: #141518; --panel: #1c1e22; --panel-2: #24272c; --ink: #e8e6e1; --muted: #9a9ea6;
  --line: #2f3238; --accent: #7aa2ff; --good: #4cc38a; --good-bg: #173326; --bad: #ff7a6b;
  --bad-bg: #3a1d1a; --warn: #e6b450; --warn-bg: #3a3018; --true: #3a3315; --true-line: #e6b450;
  --p0: #6f9cff; --p1: #f59a5c; --p2: #4fc79a; --p3: #d878c4; --p4: #c9a64a; --p5: #9a9dff;
  --rock: #b3a28e; --paper: #6db3e6; --scissors: #ef6f80;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { font-size: 12.5px; }
pre { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
      overflow: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
      max-height: 520px; margin: 0; }

.app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column;
        min-height: 0; }
.brand { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.brand h1 { font-size: 15px; margin: 0; letter-spacing: .01em; }
.brand .sub { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
.brand .tools { display: flex; gap: 6px; margin-top: 10px; }
.search { width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; }
.nav { overflow-y: auto; padding: 6px 0 20px; flex: 1; }
.nav h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
          margin: 14px 16px 4px; font-weight: 600; }
.nav a { display: flex; align-items: center; gap: 8px; padding: 4px 16px; color: var(--ink); font-size: 13px; }
.nav a:hover { background: var(--panel-2); text-decoration: none; }
.nav a.on { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
.nav a .meta { margin-left: auto; color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
.nav .grp { font-size: 12px; color: var(--muted); padding: 6px 16px 2px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line); }
.dot.pass { background: var(--good); } .dot.fail { background: var(--bad); } .dot.inc { background: var(--warn); }

main { overflow-y: auto; min-width: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 22px 28px 60px; }
.title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.title h2 { margin: 0; font-size: 20px; word-break: break-all; }
.lede { color: var(--muted); margin: 6px 0 18px; max-width: 80ch; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
          margin: 14px 0; }
section > h3 { margin: 0 0 4px; font-size: 15px; }
section > .note { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; max-width: 95ch; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi .k { color: var(--muted); font-size: 12px; }
.kpi .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .s { color: var(--muted); font-size: 12px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 18px; }
.facts div { min-width: 0; } .facts .k { color: var(--muted); font-size: 12px; }
.facts .v { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }

.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600;
         background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.badge.pass { background: var(--good-bg); color: var(--good); border-color: transparent; }
.badge.fail { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.badge.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.callout { border-radius: 8px; padding: 9px 12px; font-size: 13px; margin: 10px 0; }
.callout.warn { background: var(--warn-bg); color: var(--warn); }
.callout.bad { background: var(--bad-bg); color: var(--bad); }
.callout.info { background: var(--panel-2); color: var(--muted); }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; white-space: nowrap; background: var(--panel); }
td.r, th.r { text-align: right; }
tr.true td { background: var(--true); }
tr.true td:first-child { box-shadow: inset 3px 0 0 var(--true-line); }
tbody tr:hover td { background: var(--panel-2); }
tr.true:hover td { background: var(--true); }
td .ci { color: var(--muted); font-size: 11.5px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 18px 0 0; flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: 8px 14px; font: inherit; color: var(--muted); cursor: pointer;
               border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: var(--panel); border: 0; border-right: 1px solid var(--line); padding: 4px 11px;
              font: inherit; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--panel-2); color: var(--ink); font-weight: 600; }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px;
       font: inherit; font-size: 12.5px; color: var(--ink); cursor: pointer; }
.btn:hover { background: var(--panel-2); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 10px; }
.row label { color: var(--muted); font-size: 12.5px; }
select, input[type=text] { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
         border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 12.5px; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.sq { width: 10px; height: 10px; border-radius: 2px; }
.legend i.dash { background: none !important; border-top: 2px dashed currentColor; height: 0; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg text { fill: var(--muted); font: 11px var(--sans); }
svg .axis { stroke: var(--line); }
svg .grid line { stroke: var(--line); stroke-dasharray: 2 3; }
.strip { overflow-x: auto; padding-bottom: 4px; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
.foot { color: var(--muted); font-size: 12px; margin-top: 26px; }
.loading { color: var(--muted); padding: 40px 0; }
.prompt h4 { margin: 12px 0 6px; font-size: 13px; }
.raw { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; max-width: 520px; }
img.result { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; }

/* turn-by-turn view */
.dot.live { background: var(--bad); animation: pulse 1.4s ease-in-out infinite; }
.dot.stalled { background: var(--warn); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }
.ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ctrl input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.ctrl .rn { font-family: var(--mono); font-size: 13px; min-width: 92px; text-align: right; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
.score { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.score .p { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; border-top: 3px solid var(--pc); }
.score .p .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.score .p .k { color: var(--muted); font-size: 12px; }
.bar { height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--pc); }
.chan { border-left: 3px solid var(--muted); background: var(--panel-2); padding: 8px 12px; border-radius: 0 8px 8px 0;
        font-size: 13px; margin: 0 0 12px; }
.chan.on { border-left-color: var(--accent); }
.agents { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.agent { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column;
         gap: 8px; border-top: 3px solid var(--pc); min-width: 0; }
.agent.won { box-shadow: 0 0 0 1px var(--good) inset; }
.agent .hd { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.agent .hd b { font-size: 14px; }
.agent .hd .ci { margin-left: auto; }
.move { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 6px; font-weight: 700; font-size: 13px; letter-spacing: .03em;
        color: #fff; background: var(--mv); }
.chip.sm { padding: 1px 6px; font-size: 11px; font-weight: 600; }
.pay { font-family: var(--mono); font-weight: 700; font-size: 15px; }
.pay.w { color: var(--good); } .pay.l { color: var(--muted); }
.agent .raw { max-width: none; background: var(--panel-2); border-radius: 6px; padding: 6px 8px; max-height: 180px; overflow: auto; }
.agent .ft { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
.agent details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.waiting { color: var(--muted); font-size: 13px; padding: 10px 0 0; display: flex; gap: 8px; align-items: center; }
.recent td { padding: 4px 8px; }
.recent tr { cursor: pointer; }
.recent tr.cur td { background: var(--panel-2); }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
  .wrap { padding: 16px 16px 40px; }
  .g2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>Net influence · results</h1>
      <div class="sub" id="runsdir">loading…</div>
      <div class="tools">
        <input class="search" id="q" type="text" placeholder="Filter runs (id, condition, model)">
        <button class="btn" id="refresh" title="Reload from disk">↻</button>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main><div class="wrap" id="view"><div class="loading">Loading…</div></div></main>
</div>

<script>
"use strict";
// ------------------------------------------------------------------ state and fetching
const S = { runs: [], summary: null, details: {}, q: "",
            ui: { models: null, state: null, tab: "detection", matrix: "netinf", base: "nats",
                  callsPlayer: "all", callsFail: false, callsQ: "", callsPage: 0 } };
try { const saved = JSON.parse(localStorage.getItem("netinf-viewer-ui") || "{}");
      Object.assign(S.ui, saved, { callsPage: 0 }); } catch (e) {}
function saveUI() { try { localStorage.setItem("netinf-viewer-ui", JSON.stringify(S.ui)); } catch (e) {} }

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  const body = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok || (body && body.error && !Array.isArray(body) && Object.keys(body).length === 1))
    throw new Error(body.error || `HTTP ${r.status}`);
  return body;
}
async function loadAll() {
  S.details = {};
  const q = S.ui.models ? `?models=${encodeURIComponent(S.ui.models)}` : "";
  [S.runs, S.summary] = await Promise.all([getJSON("/api/runs"), getJSON("/api/summary" + q)]);
  if (S.ui.models && S.ui.models !== "*" && !(S.ui.models in S.summary.model_sets)) {  // saved set no longer exists
    S.ui.models = null; saveUI(); S.summary = await getJSON("/api/summary");
  }
  document.getElementById("runsdir").textContent = S.summary.runs_dir;
  if (!S.ui.state || !S.summary.states.includes(S.ui.state)) S.ui.state = S.summary.primary_state;
}

// ------------------------------------------------------------------ formatting
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = x => typeof x === "number" && isFinite(x);
const f = (x, d = 3) => isNum(x) ? x.toFixed(d) : "–";
const pct = (x, d = 0) => isNum(x) ? (100 * x).toFixed(d) + "%" : "–";
const pv = x => !isNum(x) ? "–" : x === 0 ? "0" : x < 1e-3 ? x.toExponential(1) : x.toFixed(3);
const usd = x => isNum(x) ? "$" + (x < 1 ? x.toFixed(4) : x.toFixed(2)) : "–";
const int = x => isNum(x) ? x.toLocaleString() : "–";
const MOVES = ["Rock", "Paper", "Scissors"];
const MOVE_VAR = ["--rock", "--paper", "--scissors"];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const pcol = i => `var(--p${i % 6})`;
const DET_NAMES = { netinf: "Net influence Γ", netinf_mm: "Γ, Miller–Madow", lagged_netinf: "Lagged net influence",
                    correlation: "Cramér's V", judge: "LLM judge" };
const STATE_NAMES = { prev_n_distinct: "prev. # distinct moves", none: "none (single state)", prev_joint: "prev. joint action" };
const detName = d => DET_NAMES[d] || d;
// the harness's positive-control test has changed over time, so each run is labelled with the test it recorded
const PC_TESTS = { binomial_vs_chance_one_sided: "binomial vs chance", fisher_exact_one_sided: "Fisher vs honest" };
const pcTestName = t => PC_TESTS[t] || t || "unknown test";
const stateName = s => STATE_NAMES[s] || s;
const runLabel = e => e.condition + (e.p_channel != null && e.primary != null ? ` p=${e.p_channel}` : "");
function pcBadge(passed, title = "") {
  if (passed == null) return `<span class="badge" title="${esc(title)}">n/a</span>`;
  return `<span class="badge ${passed ? "pass" : "fail"}" title="${esc(title)}">${passed ? "PASS" : "FAIL"}</span>`;
}
function table(cols, rows, opts = {}) {
  if (!rows.length) return `<div class="empty">${esc(opts.empty || "Nothing to show.")}</div>`;
  const th = cols.map(c => `<th class="${c.r ? "r" : ""}" title="${esc(c.title || "")}">${c.h}</th>`).join("");
  const tr = rows.map(row => `<tr class="${opts.rowClass ? opts.rowClass(row) : ""}">` +
    cols.map(c => `<td class="${c.r ? "r num" : ""}">${c.v(row)}</td>`).join("") + "</tr>").join("");
  return `<div class="tablewrap"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}
const seg = (name, opts, cur) => `<div class="seg" data-seg="${name}">` +
  opts.map(([v, l]) => `<button data-v="${esc(v)}" class="${v === cur ? "on" : ""}">${esc(l)}</button>`).join("") + "</div>";

// ------------------------------------------------------------------ charts (inline SVG)
function niceTicks(min, max, count = 5) {
  if (min === max) { min -= 1; max += 1; }
  const step0 = (max - min) / count, mag = 10 ** Math.floor(Math.log10(step0)), e = step0 / mag;
  const step = mag * (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1);
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
const tickFmt = v => Math.abs(v) >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + "k" : +v.toFixed(4) + "";

function lineChart({ series, xLabel = "", yLabel = "", yMin, yMax, xMin, xMax, height = 260, hlines = [], yFmt = tickFmt, dots }) {
  const W = 680, H = height, m = { l: 52, r: 14, t: 10, b: 38 };
  const pts = series.flatMap(s => s.points.filter(p => isNum(p[1])));
  if (!pts.length) return `<div class="empty">No data.</div>`;
  const x0 = xMin ?? Math.min(...pts.map(p => p[0])), x1 = xMax ?? Math.max(...pts.map(p => p[0]));
  let y0 = yMin ?? Math.min(0, ...pts.map(p => p[1])), y1 = yMax ?? Math.max(...pts.map(p => p[1]), ...hlines.map(h => h.y));
  if (y0 === y1) y1 = y0 + 1;
  const X = v => m.l + (v - x0) / ((x1 - x0) || 1) * (W - m.l - m.r);
  const Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const yt = niceTicks(y0, y1, 5).filter(v => v >= y0 - 1e-9 && v <= y1 + 1e-9), xt = niceTicks(x0, x1, 6).filter(v => v >= x0 && v <= x1);
  let g = `<g class="grid">${yt.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/>`).join("")}</g>`;
  g += yt.map(v => `<text x="${m.l - 6}" y="${Y(v) + 3.5}" text-anchor="end">${yFmt(v)}</text>`).join("");
  g += xt.map(v => `<text x="${X(v)}" y="${H - m.b + 15}" text-anchor="middle">${tickFmt(v)}</text>`).join("");
  g += `<line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}"/>`;
  g += `<text x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle">${esc(xLabel)}</text>`;
  g += `<text transform="translate(12 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle">${esc(yLabel)}</text>`;
  for (const h of hlines) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(h.y)}" y2="${Y(h.y)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>` +
    `<text x="${W - m.r}" y="${Y(h.y) - 4}" text-anchor="end">${esc(h.label)}</text>`;
  for (const s of series) {
    const p = s.points.filter(q => isNum(q[1]));
    if (!p.length) continue;

// ------------------------------------------------------------------ navigation

async function render() {
  renderNav();
  const view = document.getElementById("view"), r = route();

      if (r.id !== S.lastRun && ent?.status === "live") S.ui.tab = "turns";  // opening a live run: watch it
      S.lastRun = r.id;
      if (S.details[r.id]?._stale && S.ui.tab !== "turns") delete S.details[r.id];
      if (!S.details[r.id]) { view.innerHTML = `<div class="loading">Loading ${esc(r.id)}…</div>`; S.details[r.id] = await getJSON(`/api/run/${encodeURIComponent(r.id)}`); }

      view.innerHTML = d.kind === "game" ? gamePage(d) : d.kind === "bonjour_repro" ? bonjourPage(d) : d.kind === "scripted4" ? scripted4Page(d) : otherPage(d);
      if (d.kind === "game" && S.ui.tab === "turns") startTurns(d.id); else stopTurns();

    view.querySelectorAll("[data-seg]").forEach(el => el.addEventListener("click", async ev => {

    <button class="btn" id="t-next" title="next round (→)">▶</button>

    <input type="range" id="t-slider" min="0" max="${Math.max(0, T.rounds.length - 1)}" value="${T.cur}" aria-label="round">
    <span class="rn" id="t-rn"></span>
    <select id="t-speed" title="replay speed">${SPEEDS.map(([v, l]) => `<option value="${v}" ${v === T.speed ? "selected" : ""}>${l}</option>`).join("")}</select>
    <label id="t-follow-wrap" title="jump to each new round as it is written"><input type="checkbox" id="t-follow"> follow live</label>
  </div>
  <div class="ci" style="margin:6px 0 14px">Keys: <kbd>←</kbd> <kbd>→</kbd> step · <kbd>space</kbd> play/pause · <kbd>End</kbd> latest. Rounds appear once all agents have moved (the harness logs a round at a time).</div>`;
  el.querySelector("#t-first").onclick = () => setCur(0);
  el.querySelector("#t-prev").onclick = () => setCur(T.cur - 1);
  el.querySelector("#t-next").onclick = () => setCur(T.cur + 1);
  el.querySelector("#t-last").onclick = () => { T.follow = T.status === "live"; setCur(T.rounds.length - 1, { keepFollow: true }); };
  el.querySelector("#t-play").onclick = togglePlay;
  el.querySelector("#t-slider").oninput = e => setCur(+e.target.value);
  el.querySelector("#t-speed").onchange = e => { T.speed = e.target.value; if (T.playing) { togglePlay(); togglePlay(); } };
  el.querySelector("#t-follow").onchange = e => { T.follow = e.target.checked; if (T.follow) setCur(T.rounds.length - 1, { keepFollow: true }); };
  syncCtrl();
}
function syncCtrl() {
  const $ = id => document.getElementById(id); if (!$("t-status")) return;
  const n = T.rounds.length, total = T.meta.n_rounds;
  const st = T.status === "live" ? `<span class="dot live"></span>LIVE` : T.status === "stalled" ? `<span class="dot stalled"></span>stalled` : T.status === "done" ? `<span class="dot pass"></span>finished` : "…";
  $("t-status").innerHTML = `${st} <span class="ci">${n}/${total ?? "?"} rounds</span>`;
  $("t-slider").max = Math.max(0, n - 1); $("t-slider").value = T.cur;
  $("t-rn").textContent = n ? `round ${T.rounds[T.cur].round} · ${T.cur + 1}/${n}` : "no rounds yet";
  $("t-play").textContent = T.playing ? "❚❚ pause" : "▶ play";
  $("t-follow").checked = T.follow; $("t-follow-wrap").style.display = T.status === "live" ? "" : "none";
  for (const b of ["t-first", "t-prev"]) $(b).disabled = !n || T.cur === 0;
  for (const b of ["t-next", "t-last"]) $(b).disabled = !n || T.cur >= n - 1;
}
const agoFmt = s => !isNum(s) ? "" : s < 90 ? `${Math.round(s)} s ago` : s < 5400 ? `${Math.round(s / 60)} min ago` : `${(s / 3600).toFixed(1)} h ago`;
const moveChip = (a, sm) => a == null ? "–" : `<span class="chip ${sm ? "sm" : ""}" style="--mv:var(${MOVE_VAR[a]})">${MOVES[a].toUpperCase()}</span>`;
function assistantVerdict(a, target) {
  if (a === helping(target)) return `<span class="badge pass" title="the move the primary beats: hands the primary the point">helping move</span>`;
  if (a === counter(target)) return `<span class="badge fail" title="the move that beats the primary">counters primary</span>`;
  return `<span class="badge warn" title="same move as the primary">copies primary</span>`;
}
function renderTurnsBody() {
  const el = document.getElementById("turns-body"); if (!el) return;
  const m = T.meta, n = m.n_players || (T.rounds[0]?.actions.length ?? 0), cond = m.condition;
  const agents = (m.agents || []).slice().sort((a, b) => a.player - b.player);
  const role = i => agents[i]?.role || "honest", primary = m.primary;
  const assist = new Set(m.assistant == null ? [] : [].concat(m.assistant));
  let h = T.err ? `<div class="callout bad">Lost contact with the viewer server: ${esc(T.err)}. Retrying.</div>` : "";
  if (T.status === "stalled") h += `<div class="callout warn">Unfinished, and nothing written for ${esc(agoFmt(T.age))}: the run may have crashed or been stopped${m.stop_reason ? ` (${esc(m.stop_reason)})` : ""}.</div>`;
  if (!T.rounds.length) {
    el.innerHTML = h + `<div class="waiting">${T.status === "live" ? `<span class="dot live"></span>Waiting for round 0. Agents are deciding…` : "No rounds in this run."}</div>`;
    return;
  }
  const r = T.rounds[T.cur], t = r.round, calls = T.calls[t] || {};
  // cumulative scores up to and including the selected round
  const tot = new Array(n).fill(0), wins = new Array(n).fill(0);
  for (let k = 0; k <= T.cur; k++) T.rounds[k].payoffs.forEach((p, i) => { tot[i] += p; wins[i] += p > 0; });
  const lead = Math.max(...tot, 1);
  h += `<div class="score">${[...Array(n).keys()].map(i => `<div class="p" style="--pc:${pcol(i)}">
      <div class="k">P${i}${role(i) !== "honest" ? " · " + esc(role(i)) : ""}</div><div class="v">${tot[i]}</div>
      <div class="k">${pct(wins[i] / (T.cur + 1))} of ${T.cur + 1} rounds won</div><div class="bar"><i style="width:${100 * tot[i] / lead}%"></i></div></div>`).join("")}</div>`;
  h += `<h3 style="margin:18px 0 8px;font-size:15px">Round ${t}</h3>`;
  // private channel (C2/C4) or pre-agreed rule (C3)
  if (r.channel_delivered != null && primary != null) {
    const msg = [...assist].map(j => calls[j]?.channel_message).find(Boolean);
    h += r.channel_delivered
      ? `<div class="chan on"><b>Private channel delivered</b> to ${[...assist].map(j => "P" + j).join(", ")}: ${msg ? `“${esc(msg)}”` : `the primary P${primary} played ${moveChip(r.actions[primary], 1)} <span class="ci">(exact text not logged)</span>`}</div>`
      : `<div class="chan">Private channel <b>not delivered</b> this round (p_channel = ${esc(m.p_channel)}). The assistant decides without the primary's move.</div>`;
  } else if (cond === "C3" && primary != null) {
    const prev = T.cur > 0 ? T.rounds[T.cur - 1].actions[primary] : null;
    h += `<div class="chan on"><b>Pre-agreed rule</b> (no channel): play the move that P${primary}'s previous move beats. ${prev == null ? "No previous round yet." : `P${primary} last played ${moveChip(prev, 1)}, so the rule says ${moveChip(helping(prev), 1)}.`}</div>`;
  }
  h += `<div class="agents">${[...Array(n).keys()].map(i => {
    const c = calls[i] || {}, a = r.actions[i], p = r.payoffs[i], ro = role(i);
    let verdict = "";
    if (assist.has(i) && primary != null) {
      if (r.channel_delivered) verdict = assistantVerdict(a, r.actions[primary]);
      else if (cond === "C3" && T.cur > 0) verdict = a === helping(T.rounds[T.cur - 1].actions[primary]) ? `<span class="badge pass">followed rule</span>` : `<span class="badge fail">broke rule</span>`;
    }
    const probs = c.probs && typeof c.probs === "object" ? Object.entries(c.probs) : null;
    return `<div class="agent ${p > 0 ? "won" : ""}" style="--pc:${pcol(i)}">
      <div class="hd"><b>P${i}</b><span class="ci">“Player ${i + 1}” in prompts</span>${ro !== "honest" ? `<span class="badge ${ro === "primary" ? "warn" : ""}">${esc(ro)}</span>` : ""}</div>
      <div class="ci" style="margin-top:-6px">${esc(c.model || agents[i]?.model || "")}</div>
      <div class="move">${moveChip(a)}<span class="pay ${p > 0 ? "w" : "l"}">${p > 0 ? "+" + p : p}</span></div>
      ${verdict ? `<div>${verdict}</div>` : ""}
      ${c.raw_text != null ? `<div class="raw">${esc(c.raw_text)}</div>` : `<div class="ci">${c.model === "scripted" ? "scripted agent, no text" : "no call logged"}</div>`}
      ${probs ? `<div class="ci">probs: ${probs.map(([k, v]) => `${esc(k)} ${f(+v, 2)}`).join(" · ")}</div>` : ""}
      ${c.retry_texts?.length ? `<details><summary>re-asked ${c.retry_texts.length}× (unparseable replies)</summary>${c.retry_texts.map(x => `<div class="raw" style="margin-top:4px">${esc(x)}</div>`).join("")}</details>` : ""}
      ${c.parse_ok === false ? `<span class="badge fail" title="no parseable move; the harness used a random fallback">random fallback</span>` : ""}
      <div class="ft">${c.input_tokens != null ? `${int(c.input_tokens)}→${int(c.output_tokens)} tok` : ""}${isNum(c.latency_s) && c.latency_s > 0 ? ` · ${f(c.latency_s, 2)} s` : ""}${c.cost_usd == null ? (c.model && c.model !== "scripted" ? " · unpriced" : "") : c.cost_usd > 0 ? ` · ${usd(c.cost_usd)}` : ""}${c.cached ? " · cache" : ""}</div>
    </div>`; }).join("")}</div>`;
  if (T.status === "live" && T.cur === T.rounds.length - 1)
    h += `<div class="waiting"><span class="dot live"></span>Round ${t + 1}: agents are deciding… <span class="ci">last write ${esc(agoFmt(T.age))}</span></div>`;
  // recent rounds, newest first, around the selected one
  const lo = Math.max(0, T.cur - 12), rows = T.rounds.slice(lo, Math.min(T.rounds.length, T.cur + 4)).map((x, k) => ({ x, k: lo + k })).reverse();
  h += `<h4 style="margin:20px 0 6px;font-size:13px">Nearby rounds <span class="ci">click to jump</span></h4><div class="tablewrap"><table class="recent"><thead><tr><th>Round</th>${[...Array(n).keys()].map(i => `<th>P${i}${role(i) !== "honest" ? " " + esc(role(i)[0]) : ""}</th>`).join("")}${r.channel_delivered != null ? "<th>Channel</th>" : ""}<th>Winners</th></tr></thead><tbody>` +
    rows.map(({ x, k }) => `<tr data-k="${k}" class="${k === T.cur ? "cur" : ""}"><td class="num">${x.round}</td>${x.actions.map((a, i) => `<td>${moveChip(a, 1)}${x.payoffs[i] > 0 ? ` <span class="pay w" style="font-size:12px">+${x.payoffs[i]}</span>` : ""}</td>`).join("")}${r.channel_delivered != null ? `<td>${x.channel_delivered ? "delivered" : "<span class='ci'>–</span>"}</td>` : ""}<td class="num">${x.payoffs.every(p => p > 0) ? "all" : x.payoffs.some(p => p > 0) ? x.payoffs.map((p, i) => p > 0 ? "P" + i : "").filter(Boolean).join(" ") : "none"}</td></tr>`).join("") + `</tbody></table></div>`;
  el.innerHTML = h;
  el.querySelectorAll(".recent tr[data-k]").forEach(tr => tr.onclick = () => setCur(+tr.dataset.k));
}
document.addEventListener("keydown", e => {
  if (!turnsActive() || e.target.closest?.("input[type=text], select, textarea") || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowLeft") { setCur(T.cur - 1); e.preventDefault(); }
  else if (e.key === "ArrowRight") { setCur(T.cur + 1); e.preventDefault(); }
  else if (e.key === "Home") { setCur(0); e.preventDefault(); }
  else if (e.key === "End") { T.follow = T.status === "live"; setCur(T.rounds.length - 1, { keepFollow: true }); e.preventDefault(); }
  else if (e.key === " " && !e.target.closest?.("button")) { togglePlay(); e.preventDefault(); }
});

// ------------------------------------------------------------------ scripted studies
function mdTables(text) {
  // renders pipe tables; anything else stays preformatted
  const lines = text.split(/\r?\n/), out = []; let buf = [];
  const flush = () => { if (buf.length) { out.push(`<pre>${esc(buf.join("\n"))}</pre>`); buf = []; } };
  for (let i = 0; i < lines.length; i++) {
    if (/^\s*\|/.test(lines[i]) && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1] || "")) {
      flush(); const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(lines[i]); i += 2; const body = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) body.push(cells(lines[i++]));
      i--; out.push(`<div class="tablewrap"><table><thead><tr>${head.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td class="num">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    } else if (lines[i].trim()) buf.push(lines[i]); else flush();
  }
  flush(); return out.join("");
}
function bonjourPage(d) {
  const rows = d.results || [], base = ["nats", "bits"].includes(S.ui.base) ? S.ui.base : "nats", cfg = d.config || {};
  const cps = [...new Set(rows.filter(r => r.cda != null).map(r => r.cp))].sort((a, b) => a - b);
  const colors = cps.map((_, i) => pcol(i));
  const series = [];
  cps.forEach((cp, i) => {
    const rs = rows.filter(r => r.base === base && r.cp === cp && r.cda != null).sort((a, b) => a.games - b.games);
    series.push({ name: `CP ${cp} ours`, color: colors[i], points: rs.map(r => [r.games, r.cda]) });
    if (rs.some(r => r.paper != null)) series.push({ name: `CP ${cp} paper`, color: colors[i], dash: "5 4", points: rs.map(r => [r.games, r.paper]) });
  });
  const games = [...new Set(rows.filter(r => r.cda != null).map(r => r.games))].sort((a, b) => a - b);
  const fd = rows.filter(r => r.false_detection != null);
  let h = `<div class="title"><h2>Bonjour et al. Table 2 reproduction</h2><span class="ci num">${esc(d.id)}</span></div>
  <p class="lede">Collusion detection accuracy (CDA: % of iterations where Algorithm 1 returns exactly the seeded pair) against number of games, ${esc(cfg.players ?? "?")}-player scripted RPS, state = <code>${esc(cfg.state ?? "?")}</code>, ${esc(cfg.iters ?? "?")} iterations per point, α = ${esc(cfg.alpha ?? 0.05)}. Dashed: values from the paper's Table 2.</p>
  <section><div class="row"><label>Log base</label>${seg("base", [["nats", "nats"], ["bits", "bits"]], base)}</div>
  ${legend(cps.flatMap((cp, i) => [{ name: `CP ${cp}`, color: colors[i] }]).concat([{ name: "paper (Table 2)", color: "var(--muted)", dash: 1 }]))}
  ${lineChart({ series, xLabel: "number of games", yLabel: "CDA (%)", yMin: 0, yMax: 100, yFmt: v => v + "%" })}</section>
  <section><h3>CDA by games (${base})</h3>${table([{ h: "Games", r: 1, v: g => g }, ...cps.map(cp => ({ h: `CP ${cp}`, r: 1, v: g => { const r = rows.find(x => x.base === base && x.cp === cp && x.games === g); return r ? `${f(r.cda, 1)}${r.paper != null ? ` <span class="ci">paper ${f(r.paper, 1)}</span>` : ""}` : "–"; } }))], games)}</section>`;
  if (fd.length) h += `<section><h3>No collusion: any pair flagged</h3><p class="note">Algorithm 1 false-detection rate with no colluders (not reported in the paper).</p>${table([{ h: "Base", v: r => esc(r.base) }, { h: "Games", r: 1, v: r => r.games }, { h: "Any pair flagged", r: 1, v: r => f(r.false_detection, 1) + "%" }], fd)}</section>`;
  for (const [name, text] of Object.entries(d.texts || {})) h += `<section><h3>${esc(name)}</h3>${mdTables(text)}</section>`;
  h += filesSection(d) + `<section><h3>config.json</h3><pre>${esc(JSON.stringify(cfg, null, 2))}</pre></section>`;
  return h;
}
function scripted4Page(d) {
  const rows = d.results || [], cfg = d.config || {};
  const dets = [...new Set(rows.map(r => r.detector))], conds = [...new Set(rows.map(r => r.condition))];
  const seeded = conds.filter(c => c !== "null"), get = (c, k) => rows.find(r => r.condition === c && r.detector === k);
  let h = `<div class="title"><h2>Scripted 4-player comparison</h2><span class="ci num">${esc(d.id)}</span></div>
  <p class="lede">${esc(cfg.games ?? "?")} games per condition, ${esc(cfg.rounds ?? "?")} rounds each, seeded pair ${esc((cfg.true_pair || []).join("-"))}. Top-1 = seeded pair ranked first among 6 pairs (chance 1/6), 95% bootstrap CI over games.</p>
  <section>${legend(dets.map((k, i) => ({ name: k, color: pcol(i), sq: 1 })))}
  ${barChart({ groups: seeded, yLabel: "top-1 accuracy", hlines: [{ y: 1 / 6, label: "chance 1/6" }], series: dets.map((k, i) => ({ name: k, color: pcol(i), values: seeded.map(c => { const r = get(c, k); return r && { v: r.top1, lo: r.top1_lo, hi: r.top1_hi }; }) })) })}</section>
  <section><h3>Top-1 accuracy</h3>${table([{ h: "Condition", v: c => `<b>${esc(c)}</b>` }, ...dets.map(k => ({ h: esc(k), r: 1, v: c => { const r = get(c, k); return r ? `${f(r.top1, 2)} <span class="ci">[${f(r.top1_lo, 2)}, ${f(r.top1_hi, 2)}]</span>` : "–"; } }))], conds)}</section>
  <section><h3>Algorithm 1 rate (α = 0.05)</h3><p class="note">Seeded conditions: exactly the seeded pair flagged. Null: any pair flagged (false alarm).</p>${table([{ h: "Condition", v: c => `<b>${esc(c)}</b>` }, ...dets.filter(k => rows.some(r => r.detector === k && r.alg1_rate != null)).map(k => ({ h: esc(k), r: 1, v: c => pct(get(c, k)?.alg1_rate) }))], conds)}</section>`;
  return h + filesSection(d) + `<section><h3>config.json</h3><pre>${esc(JSON.stringify(cfg, null, 2))}</pre></section>`;
}
function otherPage(d) {
  let h = `<div class="title"><h2>${esc(d.id)}</h2></div><p class="lede">Not a recognised run format; files are listed as-is.</p>`;
  for (const [name, text] of Object.entries(d.texts || {})) h += `<section><h3>${esc(name)}</h3>${mdTables(text)}</section>`;
  return h + filesSection(d);
}

// ------------------------------------------------------------------ boot
document.getElementById("q").addEventListener("input", e => { S.q = e.target.value; renderNav(); });
document.getElementById("refresh").addEventListener("click", async () => { await loadAll(); render(); });
window.addEventListener("hashchange", () => { S.ui.callsPage = 0; render(); document.querySelector("main").scrollTop = 0; });
// keep the sidebar current (new runs, live progress) without recomputing the overview
setInterval(async () => {
  if (document.hidden) return;
  try {
    const runs = await getJSON("/api/runs");
    const sig = x => x.map(e => `${e.id}|${e.status}|${e.rounds_completed}`).join(",");
    if (sig(runs) !== sig(S.runs)) { S.runs = runs; renderNav(); }
  } catch (e) {}
}, 4000);
loadAll().then(render).catch(e => { document.getElementById("view").innerHTML = `<div class="callout bad">Could not reach the viewer server: ${esc(e.message)}</div>`; });
</script>
