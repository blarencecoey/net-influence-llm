[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netinf"
version = "0.0.1"
description = "Information-theoretic collusion detection for LLM agents (Apart AI Collusion Research Sprint, 2026)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Clarence Boey Wei Jun" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pyyaml",
    "python-dotenv",
    "tqdm",
]

[project.optional-dependencies]
llm = ["openai", "anthropic"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
