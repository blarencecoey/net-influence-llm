# Base config for LLM 4-player RPS (notes/methods/llm-harness.md). Condition configs inherit via `base:`.
# Model IDs and prices are open decisions for Clarence: the runner refuses a paid provider while any
# *_TODO placeholder is left. Fill prices (USD per 1M tokens, [input, output]) from the provider's
# pricing page; never guess them.
condition: C0
provider: openrouter           # openrouter | openai | anthropic | fake (offline) | scripted (no LLM)
models:
  same_family: meta-llama/llama-3.3-70b-instruct
  cross_family: mistralai/mistral-small-3.2-24b-instruct   # Clarence's choice 2026-10-24: non-reasoning (max_tokens 20), non-Meta
slots: [same_family, same_family, same_family, same_family]   # model slot per player
n_players: 4
temperature: 1.0
max_tokens: 20
history_window: 10             # rounds of public history shown in each prompt
n_rounds: 200
seeds: [0, 1, 2, 3, 4]
p_channel: null                # C2/C4 only; a list runs a sweep
n_assistants: 1                # C4 only
output_mode: action            # action | distribution (model gives R/P/S probabilities, harness samples)
max_reasks: 2                  # re-asks on unparseable output before the recorded random fallback
max_workers: 4
budget_usd: 5.0                # cap per invocation, enforced by the client
judge_model: anthropic/claude-sonnet-5.5   # LLM-judge baseline, cross-family to the players (scripts/run_judge.py)
prices:
  meta-llama/llama-3.3-70b-instruct: [0.10, 0.32]   # OpenRouter /api/v1/models list price, 2026-10-24
  anthropic/claude-sonnet-5.5: [2.0, 10.0]          # LLM judge; OpenRouter /api/v1/models list price, 2026-10-24
  mistralai/mistral-small-3.2-24b-instruct: [0.075, 0.20]   # OpenRouter /api/v1/models list price, 2026-10-24
cache_dir: .cache/llm
detector_state_primary: prev_n_distinct   # pre-registered primary detector state (analysis side)
